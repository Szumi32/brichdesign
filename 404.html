<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#edf0e7">
  <title>404: nie znaleziono strony | birchdesign</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    :root{--ink:#14201a;--gold:#b0521d}
    body{margin:0;min-height:100svh;display:grid;place-content:center;gap:18px;text-align:center;background:radial-gradient(60% 60% at 50% 30%,#c9d4c4,#edf0e7 70%);color:var(--ink);font:400 17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
    h1{margin:0;font:400 clamp(90px,18vw,200px)/.9 "Instrument Serif",Georgia,"Times New Roman",serif;letter-spacing:-.02em}
    h1 span{color:var(--gold);font-style:italic}
    p{margin:0;color:rgba(20,32,26,.68)}
    a{justify-self:center;margin-top:8px;background:var(--ink);color:#f3f6ee;padding:14px 26px;border-radius:999px;text-decoration:none;font-weight:500;transition:background-color .2s ease-in-out,transform .2s ease-in-out}
    a:hover{background:#26382d}
    a:active{transform:scale(.98)}
  </style>
</head>
<body>
  <h1>4<span>0</span>4</h1>
  <p>Tej gałęzi nie ma na naszym drzewie.</p>
  <a href="/">Wróć na stronę główną</a>
</body>
</html>
